name: stallion_one
description: "Stallion One HRMS"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.1

  # Authentication
  google_sign_in: ^6.3.0

  # State Management
  flutter_riverpod: ^3.3.2

  # Notifications
  flutter_local_notifications: ^22.0.1

  # File Picker
  file_picker: ^11.0.2

  # URL Launcher
  url_launcher: ^6.3.1

  # Calendar
  table_calendar: ^3.1.3

  # HTTP
  http: ^1.3.0

  # Excel
  excel: ^4.0.6

  # Storage
  path_provider: ^2.1.5

  permission_handler: ^12.0.3

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21